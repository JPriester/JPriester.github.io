- title: Experience
  type: time_table
  contents:
    - title: PhD Student
      institution: University of California, Santa Cruz
      year: Sep 2022 - Present
      description:
        - My PhD research at the Hybrid Systems Lab integrates hybrid systems theory with reinforcement learning (RL) to develop algorithms with enhanced safety, robustness, and policy capabilities for real-world complex systems.
        - Focus on creating robust hybrid supervisory mechanisms that prevent detrimental policy 'chattering' and ensure stable transitions under noise and adversarial conditions.
        - title: Key Publications
          contents:
            - "<b>A Timer-Based Hybrid Supervisor for Robust, Chatter-Free Policy Switching</b> (RLJ, 2025): Developed a hybrid supervisor that guarantees robust, chatter-free policy switching in RL under bounded measurement noise."
            - "<b>MultiHyRL: Robust Hybrid RL for Obstacle Avoidance against Adversarial Attacks</b> (RLJ, 2024): Introduced MultiHyRL, a novel hybrid RL algorithm that strategically partitions the state space and learns specialized policies for each partition."

    - title: Remote Student Researcher
      institution: Hybrid Systems Laboratory (Remote)
      year: May 2021 - Aug 2022
      description:
        - Continued remote research focusing on enhancing the safety and robustness of RL algorithms through hybrid control theory.
        - Investigated hysteresis-based mechanisms to improve RL control policy robustness under Professor Ricardo G. Sanfelice.
        - title: Publications
          contents:
            - "<b>Hysteresis-Based RL</b> (ACC, 2022): Addressed lack of robustness in standard RL policies by developing a novel hybrid algorithm implementing hysteresis."

    - title: Visiting Research Scholar
      institution: University of California, Santa Cruz
      year: Aug 2019 - Oct 2019
      description:
        - Engaged in a 3-month research visit at the Hybrid Systems Laboratory.
        - Contributed to foundational research exploring robust control strategies for complex dynamic systems.

