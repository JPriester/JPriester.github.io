<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <defs>
    <linearGradient id="bgIS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>
  <rect width="360" height="240" rx="14" fill="url(#bgIS)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="24" y="34" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Intrinsic UPAS in Discrete-Time RL</text>
  <!-- Axes -->
  <line x1="42" y1="195" x2="332" y2="195" stroke="#475569" stroke-width="1.8"/>
  <line x1="42" y1="50" x2="42" y2="195" stroke="#475569" stroke-width="1.8"/>
  <text x="175" y="216" font-family="monospace" font-size="10" fill="#475569">Discrete Step k →</text>
  <text x="16" y="125" font-family="monospace" font-size="10" fill="#475569" transform="rotate(-90 22,125)">ω(x_k)</text>
  <!-- UPAS Neighborhood Band -->
  <rect x="43" y="152" width="288" height="42" fill="#dbeafe" opacity="0.65"/>
  <line x1="42" y1="152" x2="332" y2="152" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="212" y="146" font-family="monospace" font-size="10" font-weight="700" fill="#1d4ed8">ν̃(γ, δ) Bound</text>
  <!-- Curves for different gamma/delta -->
  <path d="M 42 62 Q 95 132, 138 135 L 328 135" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <path d="M 42 62 Q 105 150, 152 152 L 328 152" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M 42 62 Q 118 176, 175 178 L 328 178" fill="none" stroke="#059669" stroke-width="2.8"/>
  <!-- Legend labels -->
  <text x="255" y="129" font-family="monospace" font-size="9.5" fill="#b45309">γ = 0.88</text>
  <text x="255" y="172" font-family="monospace" font-size="9.5" fill="#047857">γ = 0.98, δ → 0</text>
</svg>
