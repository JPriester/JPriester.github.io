<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <defs>
    <linearGradient id="bgLM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <radialGradient id="obsGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
  </defs>
  <rect width="360" height="240" rx="14" fill="url(#bgLM)" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Overlapping Hysteresis Band -->
  <rect x="20" y="95" width="240" height="50" fill="#fce7f3" opacity="0.7" rx="4"/>
  <line x1="20" y1="95" x2="260" y2="95" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="20" y1="145" x2="260" y2="145" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="28" y="42" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">L-MultiHyRL: SE(3) + SO(3)</text>
  <text x="28" y="114" font-family="monospace" font-size="10" fill="#be185d">2ρ Hysteresis Overlap</text>
  <!-- 3D Obstacle Sphere -->
  <circle cx="175" cy="120" r="34" fill="url(#obsGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <ellipse cx="175" cy="120" rx="34" ry="12" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Committed Policy 1 (Blue) -->
  <path d="M 38 115 C 90 112, 125 55, 175 54 C 225 53, 270 95, 315 118" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Committed Policy 2 (Green) -->
  <path d="M 38 125 C 90 128, 125 185, 175 186 C 225 187, 270 145, 315 122" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Chattering Standard PPO (Red Crash) -->
  <path d="M 38 120 L 62 110 L 80 132 L 98 106 L 116 130 L 132 114 L 142 120" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,2"/>
  <circle cx="142" cy="120" r="5" fill="#dc2626"/>
  <!-- Target Star -->
  <circle cx="320" cy="120" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="275" y="218" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#047857">100% Robust</text>
</svg>
