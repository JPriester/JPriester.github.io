<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290">
  <rect width="820" height="290" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Left Plot: Effect of Discount Factor gamma (Example 3, Fig. 1) -->
  <rect x="22" y="20" width="376" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="44" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Example 3: Effect of Discount Factor γ (Exact Policy)</text>
  <text x="38" y="61" font-family="monospace" font-size="10.5" fill="#475569">Analytical bound: ν(γ) = 5(1 - γ) / (2γ)</text>

  <!-- Axes Left -->
  <line x1="65" y1="230" x2="375" y2="230" stroke="#475569" stroke-width="1.5"/>
  <line x1="65" y1="78" x2="65" y2="230" stroke="#475569" stroke-width="1.5"/>
  <text x="40" y="84" font-family="monospace" font-size="9.5" fill="#475569">1.0</text>
  <text x="40" y="155" font-family="monospace" font-size="9.5" fill="#475569">0.5</text>
  <text x="40" y="230" font-family="monospace" font-size="9.5" fill="#475569">0.0</text>
  <text x="195" y="252" font-family="monospace" font-size="10" fill="#475569">Time Step k ∈ [0, 30]</text>

  <!-- Trajectories Left -->
  <!-- gamma = 0.85 -> nu = 0.441 -->
  <path d="M 65 80 L 118 163 L 370 163" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="295" y="157" font-family="monospace" font-size="9.5" font-weight="700" fill="#1d4ed8">γ = 0.85 (ν=0.44)</text>
  <!-- gamma = 0.90 -> nu = 0.278 -->
  <path d="M 65 80 L 136 188 L 370 188" fill="none" stroke="#d97706" stroke-width="2.4"/>
  <text x="295" y="182" font-family="monospace" font-size="9.5" font-weight="700" fill="#b45309">γ = 0.90 (ν=0.28)</text>
  <!-- gamma = 0.96 -> nu = 0.104 -->
  <path d="M 65 80 L 155 214 L 370 214" fill="none" stroke="#059669" stroke-width="2.4"/>
  <text x="295" y="209" font-family="monospace" font-size="9.5" font-weight="700" fill="#047857">γ = 0.96 (ν=0.10)</text>
  <!-- gamma = 0.99 -> nu = 0.025 -->
  <path d="M 65 80 L 166 226 L 370 226" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5,3"/>
  <text x="295" y="224" font-family="monospace" font-size="9.5" font-weight="700" fill="#dc2626">γ = 0.99 (ν=0.03)</text>

  <!-- Right Plot: Effect of NN Approximation Error delta (Example 4, Fig. 2) -->
  <rect x="420" y="20" width="376" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="436" y="44" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Example 4: Effect of NN Error δ (at Fixed γ = 0.90)</text>
  <text x="436" y="61" font-family="monospace" font-size="10.5" fill="#475569">Parameterized ReLU boundary: ν̃(γ,δ) = ν(0.90) / w_δ</text>

  <!-- Axes Right -->
  <line x1="463" y1="230" x2="773" y2="230" stroke="#475569" stroke-width="1.5"/>
  <line x1="463" y1="78" x2="463" y2="230" stroke="#475569" stroke-width="1.5"/>
  <text x="438" y="84" font-family="monospace" font-size="9.5" fill="#475569">1.0</text>
  <text x="438" y="155" font-family="monospace" font-size="9.5" fill="#475569">0.5</text>
  <text x="438" y="230" font-family="monospace" font-size="9.5" fill="#475569">0.0</text>
  <text x="593" y="252" font-family="monospace" font-size="10" fill="#475569">Time Step k ∈ [0, 30]</text>

  <!-- Analytical Baseline dashed line at nu(0.90) = 0.278 -->
  <line x1="463" y1="188" x2="770" y2="188" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="655" y="202" font-family="monospace" font-size="9.5" fill="#0f172a">Exact ν(0.90) = 0.28</text>

  <!-- delta = 0.30 (w=0.6 -> 0.463) -->
  <path d="M 463 80 L 515 160 L 770 160" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="678" y="154" font-family="monospace" font-size="9.5" font-weight="700" fill="#1d4ed8">δ = 0.30 (ν̃=0.46)</text>
  <!-- delta = 0.04 (w=0.8 -> 0.347) -->
  <path d="M 463 80 L 528 177 L 770 177" fill="none" stroke="#d97706" stroke-width="2.4"/>
  <text x="678" y="172" font-family="monospace" font-size="9.5" font-weight="700" fill="#b45309">δ = 0.04 (ν̃=0.35)</text>
  <!-- delta = 0.01 (w=0.9 -> 0.308) -->
  <path d="M 463 80 L 533 183 L 770 183" fill="none" stroke="#059669" stroke-width="2.4"/>
  <text x="545" y="180" font-family="monospace" font-size="9.5" font-weight="700" fill="#047857">δ = 0.01 (ν̃=0.31)</text>
</svg>
