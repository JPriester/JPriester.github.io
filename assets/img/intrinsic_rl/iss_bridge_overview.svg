<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="820" height="300" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="28" y="34" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#0f172a">How Unmodified Discounted Deep RL Intrinsically Guarantees Closed-Loop Practical Stability</text>

  <!-- Disturbance 1: Discount Factor -->
  <rect x="24" y="56" width="225" height="98" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="38" y="80" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#92400e">1. Discounted Horizon (γ &lt; 1)</text>
  <text x="38" y="100" font-family="Inter, sans-serif" font-size="10.5" fill="#78350f">Myopic horizon truncation acts as</text>
  <text x="38" y="116" font-family="Inter, sans-serif" font-size="10.5" fill="#78350f">a bounded ISS disturbance:</text>
  <text x="38" y="138" font-family="monospace" font-size="11" font-weight="700" fill="#b45309">d_γ = ((1-γ)/γ) α̅_V(σ_max)</text>

  <!-- Disturbance 2: NN Approximation Error -->
  <rect x="24" y="172" width="225" height="104" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="38" y="196" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e40af">2. Neural Net Suboptimality (δ &gt; 0)</text>
  <text x="38" y="216" font-family="Inter, sans-serif" font-size="10.5" fill="#1e3a8a">Expected gap J_γ(κ*) - J_γ(κ_ψ*) ≤ δ</text>
  <text x="38" y="232" font-family="Inter, sans-serif" font-size="10.5" fill="#1e3a8a">bounds worst-case pointwise error:</text>
  <text x="38" y="254" font-family="monospace" font-size="11" font-weight="700" fill="#1d4ed8">max_x |V*(x) - V̂(x)| ≤ α_γ(δ) =: ε_δ</text>

  <!-- Center: ISS Lyapunov Mechanism -->
  <rect x="288" y="56" width="250" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="306" y="82" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Discrete-Time ISS-Lyapunov Bridge</text>
  <rect x="304" y="96" width="218" height="46" rx="8" fill="#f1f5f9"/>
  <text x="316" y="116" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">Lyapunov: Y(x) := -V_γ^{κ_γ*}(x)</text>
  <text x="316" y="133" font-family="monospace" font-size="10" fill="#475569">α̲_Y(σ(x)) ≤ Y(x) ≤ α̅_Y(σ(x))</text>

  <rect x="304" y="154" width="218" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="316" y="175" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e40af">One-Step Bellman Decrease:</text>
  <text x="316" y="196" font-family="monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">Y(x^+) - Y(x) ≤ -α_Y(Y(x)) + d̃_{γ,δ}</text>

  <text x="312" y="238" font-family="monospace" font-size="10.5" fill="#334155">Combined disturbance:</text>
  <text x="312" y="256" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">d̃_{γ,δ} = d_γ + ε_δ / γ</text>

  <!-- Right: Closed-Loop UPAS Guarantee -->
  <rect x="576" y="56" width="220" height="220" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/>
  <text x="592" y="82" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Closed-Loop UPAS (Thm 4.5)</text>
  <text x="592" y="106" font-family="Inter, sans-serif" font-size="10.5" fill="#047857">Every trajectory x_k under the</text>
  <text x="592" y="122" font-family="Inter, sans-serif" font-size="10.5" fill="#047857">parameterized NN policy κ_ψ* satisfies:</text>
  <rect x="590" y="136" width="192" height="44" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="598" y="162" font-family="monospace" font-size="10.5" font-weight="700" fill="#065f46">σ(x_k) ≤ max{β(σ(x_0),k), ν̃(γ,δ)}</text>
  <text x="592" y="206" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#065f46">Vanishing Steady-State Error:</text>
  <text x="592" y="226" font-family="monospace" font-size="11" font-weight="700" fill="#047857">lim_{γ→1} lim_{δ→0} ν̃(γ,δ) = 0</text>
  <text x="592" y="254" font-family="Inter, sans-serif" font-size="10" fill="#065f46">✓ No algorithmic modifications needed</text>

  <!-- Connectors -->
  <line x1="249" y1="105" x2="284" y2="145" stroke="#d97706" stroke-width="2" marker-end="url(#arrA)"/>
  <line x1="249" y1="220" x2="284" y2="195" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="538" y1="166" x2="572" y2="166" stroke="#059669" stroke-width="2.2" marker-end="url(#arrE)"/>
</svg>
