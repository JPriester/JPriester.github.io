<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290">
  <rect width="820" height="290" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="28" y="34" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Sim-to-Real Deployment on ModalAI Sentinel Quadrotor &amp; Cumulative Success Rate</text>

  <!-- Left: Sim-to-Real Architecture -->
  <rect x="24" y="52" width="420" height="218" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="76" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">Zero-Retraining Sim-to-Real Pipeline (VOXL 2 + ROS 2 + PX4)</text>

  <rect x="40" y="92" width="115" height="68" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="48" y="114" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e40af">MoCap + Virtual</text>
  <text x="48" y="130" font-family="monospace" font-size="9.5" fill="#334155">120 Hz Position p</text>
  <text x="48" y="145" font-family="monospace" font-size="9.5" fill="#334155">Local Views V</text>

  <rect x="174" y="92" width="125" height="68" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="182" y="114" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#065f46">Onboard VOXL 2</text>
  <text x="182" y="130" font-family="monospace" font-size="9.5" fill="#047857">L-MultiHyRL (25Hz)</text>
  <text x="182" y="145" font-family="monospace" font-size="9.5" fill="#047857">+ Kinematic Sim q</text>

  <rect x="318" y="92" width="110" height="68" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="328" y="114" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#92400e">PX4 Inner Loop</text>
  <text x="328" y="130" font-family="monospace" font-size="9.5" fill="#78350f">Inertial R(q)v</text>
  <text x="328" y="145" font-family="monospace" font-size="9.5" fill="#78350f">2nd-Order Tilt</text>

  <text x="40" y="190" font-family="Inter, sans-serif" font-size="11" fill="#334155">• Parallel onboard kinematic propagation bridges 1st-order policy</text>
  <text x="48" y="207" font-family="Inter, sans-serif" font-size="11" fill="#334155">kinematics with underactuated 2nd-order quadrotor dynamics.</text>
  <text x="40" y="229" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#047857">• Eliminates attitude chattering &amp; obstacle collisions in physical flight.</text>

  <!-- Right: Cumulative Success Rate Chart (Fig. 11 reproduction) -->
  <rect x="464" y="52" width="332" height="218" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="482" y="76" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Success Rate Under Perturbation (ε_p = 0.20)</text>

  <!-- Axes -->
  <line x1="510" y1="225" x2="770" y2="225" stroke="#475569" stroke-width="1.6"/>
  <line x1="510" y1="98" x2="510" y2="225" stroke="#475569" stroke-width="1.6"/>
  <line x1="510" y1="105" x2="770" y2="105" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="476" y="109" font-family="monospace" font-size="10" fill="#0f172a">100%</text>
  <text x="482" y="166" font-family="monospace" font-size="10" fill="#64748b">50%</text>
  <text x="488" y="225" font-family="monospace" font-size="10" fill="#64748b">0%</text>

  <!-- L-MultiHyRL 100% Curve -->
  <path d="M 510 225 L 555 225 C 585 225, 610 105, 650 105 L 765 105" fill="none" stroke="#059669" stroke-width="3.2" stroke-dasharray="6,3"/>
  <text x="655" y="97" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#059669">L-MultiHyRL: 100%</text>

  <!-- Standard PPO Degraded Curve (60.4%) -->
  <path d="M 510 225 L 545 225 C 570 225, 595 155, 630 155 L 765 155" fill="none" stroke="#dc2626" stroke-width="2.8"/>
  <text x="635" y="172" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#dc2626">Standard PPO: 60.4%</text>

  <text x="565" y="250" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">225–242 dense 3D initial conditions</text>
</svg>
