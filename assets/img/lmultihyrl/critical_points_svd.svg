<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310">
  <rect width="820" height="310" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Panel A: Critical Point Identification -->
  <rect x="20" y="20" width="248" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="34" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#0f172a">(a) Critical Point Search (Alg. 1)</text>
  <circle cx="195" cy="155" r="36" fill="#94a3b8" stroke="#334155" stroke-width="1.8"/>
  <text x="172" y="159" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Obstacle</text>
  <!-- Candidate state and shifted states -->
  <circle cx="72" cy="155" r="4.5" fill="#dc2626"/>
  <text x="34" y="159" font-family="monospace" font-size="10.5" fill="#dc2626" font-weight="700">(p,q)</text>
  <circle cx="72" cy="128" r="3.5" fill="#1d4ed8"/>
  <text x="32" y="118" font-family="monospace" font-size="9.5" fill="#1d4ed8">(p+ν,q)</text>
  <circle cx="72" cy="182" r="3.5" fill="#059669"/>
  <text x="32" y="198" font-family="monospace" font-size="9.5" fill="#059669">(p-ν,q)</text>
  <!-- Diverging trajectories -->
  <path d="M 72 128 C 115 124, 145 86, 225 82" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="200" y="74" font-family="monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">ϕ_1 (Route 1)</text>
  <path d="M 72 182 C 115 186, 145 224, 225 228" fill="none" stroke="#059669" stroke-width="2.5"/>
  <text x="200" y="244" font-family="monospace" font-size="10.5" font-weight="700" fill="#059669">ϕ_2 (Route 2)</text>
  <text x="34" y="272" font-family="Inter, sans-serif" font-size="10.5" fill="#475569">max_k |ϕ_{1,p} - ϕ_{2,p}| &gt; D_thresh</text>

  <!-- Panel B: SVD Best-Fit Plane & 2rho Overlap -->
  <rect x="286" y="20" width="248" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="300" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#0f172a">(b) SVD Bisection &amp; Overlap 2ρ</text>
  <rect x="300" y="65" width="220" height="88" fill="#eff6ff" rx="6"/>
  <rect x="300" y="153" width="220" height="88" fill="#ecfdf5" rx="6"/>
  <rect x="300" y="129" width="220" height="48" fill="#fce7f3" opacity="0.85"/>
  <line x1="300" y1="129" x2="520" y2="129" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="300" y1="177" x2="520" y2="177" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="300" y1="153" x2="520" y2="153" stroke="#be185d" stroke-width="1.8"/>
  <!-- Critical set M* dots -->
  <circle cx="340" cy="151" r="3" fill="#dc2626"/>
  <circle cx="358" cy="155" r="3" fill="#dc2626"/>
  <circle cx="375" cy="149" r="3" fill="#dc2626"/>
  <circle cx="392" cy="156" r="3" fill="#dc2626"/>
  <circle cx="410" cy="152" r="3" fill="#dc2626"/>
  <circle cx="375" cy="153" r="5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="366" y="143" font-family="monospace" font-size="10" font-weight="700" fill="#be185d">p^c</text>
  <circle cx="468" cy="153" r="32" fill="#94a3b8" stroke="#334155" stroke-width="1.8"/>
  <text x="355" y="95" font-family="monospace" font-size="12" font-weight="700" fill="#1d4ed8">M_1^{exp}</text>
  <text x="355" y="220" font-family="monospace" font-size="12" font-weight="700" fill="#047857">M_2^{exp}</text>
  <text x="302" y="272" font-family="Inter, sans-serif" font-size="10.5" fill="#be185d">Shared hysteresis band M_1^{exp} ∩ M_2^{exp}</text>

  <!-- Panel C: Dual Hysteresis Switching -->
  <rect x="552" y="20" width="248" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="566" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#0f172a">(c) SO(3) Quaternion Hysteresis</text>
  <!-- S3 semicircle diagram -->
  <path d="M 590 190 A 85 85 0 0 1 760 190" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M 650 108 A 85 85 0 0 1 760 190" fill="none" stroke="#059669" stroke-width="4"/>
  <path d="M 590 190 A 85 85 0 0 1 700 108" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="6,3"/>
  <line x1="575" y1="190" x2="775" y2="190" stroke="#475569" stroke-width="1.5"/>
  <line x1="675" y1="95" x2="675" y2="205" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="650" y1="105" x2="650" y2="200" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="700" y1="105" x2="700" y2="200" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="582" y="210" font-family="monospace" font-size="10" fill="#1d4ed8">-1</text>
  <text x="640" y="214" font-family="monospace" font-size="10" fill="#059669">-δ_η</text>
  <text x="671" y="214" font-family="monospace" font-size="10" fill="#475569">0</text>
  <text x="694" y="214" font-family="monospace" font-size="10" fill="#1d4ed8">+δ_η</text>
  <text x="752" y="210" font-family="monospace" font-size="10" fill="#059669">+1</text>
  <text x="566" y="245" font-family="Inter, sans-serif" font-size="10.5" fill="#334155">Margin δ_η &gt; sin(ε_q / 2) prevents</text>
  <text x="566" y="262" font-family="Inter, sans-serif" font-size="10.5" fill="#334155">chattering between ±1 poles in SO(3)</text>
</svg>
