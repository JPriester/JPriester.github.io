<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="820" height="340" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="28" y="34" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="15" font-weight="800" fill="#0f172a">L-MultiHyRL: Perception-Driven Hybrid Architecture in SE(3) &amp; SO(3)</text>

  <!-- Multimodal Inputs -->
  <rect x="24" y="58" width="155" height="115" rx="12" fill="url(#cardGrad)" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="38" y="80" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Local Visual V(z)</text>
  <rect x="38" y="90" width="56" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <circle cx="66" cy="113" r="11" fill="#1e293b"/>
  <text x="48" y="150" font-family="monospace" font-size="10" fill="#475569">V_xy (Horiz)</text>
  <rect x="106" y="90" width="56" height="46" rx="6" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.2"/>
  <circle cx="134" cy="113" r="11" fill="#1e293b"/>
  <text x="115" y="150" font-family="monospace" font-size="10" fill="#475569">V_xz (Elev)</text>

  <rect x="24" y="192" width="155" height="118" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="38" y="214" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Global Target o_vec</text>
  <text x="38" y="236" font-family="monospace" font-size="11" fill="#334155">e_p(z) = |p|_{p*}</text>
  <text x="38" y="256" font-family="monospace" font-size="11" fill="#059669">e_η(z,ϑ) = ϑ - η_e(z)</text>
  <text x="38" y="276" font-family="monospace" font-size="11" fill="#334155">ε_e(z) ∈ ℝ³</text>
  <text x="38" y="297" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Quaternion Hysteresis ϑ</text>

  <!-- Feature Extractor Block -->
  <rect x="215" y="58" width="175" height="252" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="232" y="82" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Shared Feature Extractor</text>
  <rect x="230" y="96" width="145" height="66" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="244" y="118" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e40af">CNN Branch Φ_CNN</text>
  <text x="244" y="135" font-family="monospace" font-size="10" fill="#334155">L:[32,32], K:[3,3]</text>
  <text x="244" y="150" font-family="monospace" font-size="10" fill="#1d4ed8">Latent h_V(z) ∈ ℝ^{n_h}</text>

  <rect x="230" y="212" width="145" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="244" y="234" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#334155">Linear Layer</text>
  <text x="244" y="252" font-family="monospace" font-size="10" fill="#475569">L:[32] (ReLU)</text>

  <!-- Latent Classifier & Hybrid Supervisor -->
  <rect x="430" y="58" width="185" height="118" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/>
  <text x="444" y="80" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#065f46">Latent Partition Classifier Γ</text>
  <text x="444" y="100" font-family="monospace" font-size="10.5" fill="#047857">ŷ_λ(z) = [Γ(h_V(z))]_λ</text>
  <text x="444" y="120" font-family="Inter, sans-serif" font-size="10.5" fill="#065f46">Predicts M_1^{exp}, M_2^{exp}</text>
  <text x="444" y="138" font-family="Inter, sans-serif" font-size="10.5" fill="#065f46">solely from local features</text>
  <text x="444" y="158" font-family="monospace" font-size="10" fill="#047857">0 &lt; μ̲ &lt; 0.5 &lt; μ̅ &lt; 1</text>

  <rect x="430" y="192" width="185" height="118" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="444" y="214" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#92400e">Hybrid Supervisor H_s</text>
  <text x="444" y="234" font-family="monospace" font-size="10.5" fill="#78350f">State x = (z, λ, ϑ)</text>
  <text x="444" y="253" font-family="Inter, sans-serif" font-size="10.5" fill="#92400e">• Spatial memory λ ∈ {1,2}</text>
  <text x="444" y="271" font-family="Inter, sans-serif" font-size="10.5" fill="#92400e">• Attitude pole ϑ ∈ {-1,+1}</text>
  <text x="444" y="292" font-family="monospace" font-size="10" fill="#b45309">Flow C_λ ∩ C_ϑ | Jump D_λ ∪ D_ϑ</text>

  <!-- Specialized Local Policies -->
  <rect x="650" y="58" width="146" height="252" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="664" y="82" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Local Policies κ_λ</text>
  <rect x="664" y="98" width="118" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="676" y="120" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Policy κ_1 (λ=1)</text>
  <text x="676" y="138" font-family="monospace" font-size="10" fill="#334155">Stays in M_1^{exp}</text>

  <rect x="664" y="172" width="118" height="58" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="676" y="194" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#047857">Policy κ_2 (λ=2)</text>
  <text x="676" y="212" font-family="monospace" font-size="10" fill="#334155">Stays in M_2^{exp}</text>

  <rect x="664" y="246" width="118" height="48" rx="8" fill="#0f172a"/>
  <text x="676" y="267" font-family="monospace" font-size="10.5" font-weight="700" fill="#ffffff">u = (u_v, u_y, u_z)</text>
  <text x="676" y="283" font-family="Inter, sans-serif" font-size="9.5" fill="#93c5fd">Chatter-Free Action</text>

  <!-- Arrows -->
  <line x1="179" y1="125" x2="226" y2="125" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="179" y1="240" x2="226" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="375" y1="125" x2="426" y2="115" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <line x1="522" y1="176" x2="522" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <line x1="615" y1="240" x2="648" y2="205" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="390" y1="145" x2="648" y2="145" stroke="#475569" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrowSlate)"/>
</svg>
